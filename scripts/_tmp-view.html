<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>html,body,iframe{margin:0;height:100%;width:100%;border:0;display:block}</style>
</head>
<body>
  <iframe id="f" src="/"></iframe>
  <script>
    const sel = new URLSearchParams(location.search).get("s") || "#teste-burnout";
    const f = document.getElementById("f");
    f.addEventListener("load", () => {
      const d = f.contentDocument;
      d.querySelector(sel)?.scrollIntoView({ block: "center" });
    });
  </script>
</body>
</html>
